# Bootstrapper config — copy to config.yaml and fill in your values.
# Two provider options: hetzner (cloud) or local (WSL2 / local VM).
# Uncomment the section that applies and fill in your values.

# ─────────────────────────────────────────────
# OPTION A: Hetzner Cloud
# ─────────────────────────────────────────────
provider: hetzner
api_token: "YOUR_HETZNER_API_TOKEN"

# SSH keys: public key is uploaded to Hetzner, private key is used for deployment SSH.
# Keep keys outside the repo (e.g. in ~/.ssh) and reference them by absolute path.
ssh_key: "/path/to/your/.ssh/your-key.pub"      # or /home/you/.ssh/your-key.pub
ssh_private_key: "/path/to/your/.ssh/your-key"

# Hetzner server options
server_type: cpx21        # run: bootstrapper server-types  to list available types
server_name: forgejo-authentik-server
location: nbg1            # nbg1 (Nuremberg), fsn1 (Falkenstein), hel1 (Helsinki)

forgejo:
  admin_username: "siteadmin"   # avoid reserved names: admin, root, git
  admin_password: "CHANGE_ME"
  domain: "git.yourdomain.nl"
  email: "admin@yourdomain.nl"

authentik:
  admin_username: "akadmin"     # informational only; Authentik bootstrap user is always 'akadmin'
  admin_password: "CHANGE_ME"
  domain: "iam.yourdomain.nl"
  email: "admin@yourdomain.nl"
  admin_group: "forgejo-admins" # members of this group get Forgejo admin rights via SSO
  groups:                       # groups to create in Authentik (idempotent)
    - forgejo-admins
    - platform-devs
    - website-devs
    - platform-readers
    - website-readers

argocd_domain: "argocd.yourdomain.nl"   # required; Argo CD web UI
# headlamp_domain: "headlamp.yourdomain.nl"  # optional; Kubernetes web UI (Headlamp) with Authentik SSO
# portal_domain: "portal.yourdomain.nl"      # optional; friendly redirect to the Authentik app dashboard
# analytics_domain: "stats.yourdomain.nl"    # optional; Umami cookieless analytics (no consent banner)

# Optional backups: every Forgejo repo gets a private GitHub push-mirror
# (synced on commit) and the platform databases get nightly encrypted dumps
# to a private GitHub repo. Token needs the `repo` scope.
# github_mirror_token: "ghp_..."


# ─────────────────────────────────────────────
# OPTION B: Local (WSL2)
# ─────────────────────────────────────────────
# Deploys into a local WSL2 instance. No cloud account or API token needed.
# Certs are self-signed (browser will warn once; click through).
#
# Domains use nip.io — a public wildcard DNS where anything.127.0.0.1.nip.io
# resolves to 127.0.0.1. No /etc/hosts editing needed.
#
# One-time WSL2 setup (run these inside WSL2 before first provision):
#   sudo apt install openssh-server
#   sudo service ssh start                      # or: sudo systemctl enable --now ssh
#   mkdir -p ~/.ssh && chmod 700 ~/.ssh
#   echo "$(cat /path/to/your/key.pub)" >> ~/.ssh/authorized_keys
#   chmod 600 ~/.ssh/authorized_keys
#   echo "noud ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/noud
#
# provider: local
# local:
#   host: 127.0.0.1      # WSL2 ports are forwarded to Windows localhost automatically
#   ssh_user: noud       # your WSL2 username
#
# ssh_private_key: "C:/Users/noud/.ssh/your-key"   # Windows path to private key
#
# forgejo:
#   admin_username: "siteadmin"
#   admin_password: "CHANGE_ME"
#   domain: "git.127.0.0.1.nip.io"
#   email: "admin@local.dev"
#
# authentik:
#   admin_username: "akadmin"
#   admin_password: "CHANGE_ME"
#   domain: "auth.127.0.0.1.nip.io"
#   email: "admin@local.dev"
#   admin_group: "forgejo-admins"
#   groups:
#     - forgejo-admins
#     - platform-devs
#
# argocd_domain: "argocd.127.0.0.1.nip.io"


# Docker image tags (both providers)
forgejo_version: "latest"
authentik_version: "2024.10.5"
